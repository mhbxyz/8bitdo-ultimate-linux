[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ultim8do"
version = "0.1.0"
description = "Linux CLI tooling for inspecting 8BitDo Ultimate controllers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "mhbxyz" },
]
keywords = ["8bitdo", "controller", "evdev", "linux", "udev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
]
dependencies = [
  "evdev>=1.9.2",
  "pyudev>=0.24.3",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]
hid = [
  "hid-tools>=0.8",
]

[project.scripts]
ultim8do = "ultim8do.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ultim8do"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
